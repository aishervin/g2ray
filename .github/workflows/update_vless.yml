name: Update VLESS Subscriptions

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Collector and Ping Tester
        run: |
          python collector.py

      - name: Commit and Push Updated Configurations
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add vless.txt
          if git diff --staged --quiet; then
            echo "No changes detected in vless.txt"
          else
            git commit -m "Auto-update: refresh low-ping VLESS configs [skip ci]"
            git push
          fi
